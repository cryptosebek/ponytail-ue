description = "Show ponytail-ue measured impact from the Unreal benchmark"
prompt = "Show the ponytail gain card. One shot, change nothing: do not switch mode, write flag files, or persist anything. Print this measured Unreal benchmark (5 tickets x 3 arms x 6 runs, Sonnet, UE 5.8 builds; one model, so small gaps are noise), done / safe / done+safe / mean lines per 30 runs: no plugin 25/30, 24/30, 19/30, 16.2; ponytail-ue earlier rules 28/30, 30/30, 28/30, 13.7; ponytail-ue current rules 25/30, 30/30, 25/30, 13.9. Clear gap: the rename ticket, CoreRedirect added 12/12 with ponytail-ue vs 0/6 without. The newest rules did not improve the save ticket (builds 1/6 vs 4/6). Plugin runs cost about $0.08 vs $0.06 without. Do not quote upstream web-task numbers. Reproduce with node benchmarks/run.js --all --runs 6 --compile. NEVER print a per-repo savings number: the unbuilt version was never written, so there is no real baseline to subtract from in a live repo. For real per-repo figures, point to /ponytail-debt (the counted shortcut ledger) and /ponytail-audit (what is still cuttable). Report only."
